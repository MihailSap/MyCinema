databaseChangeLog:
  - changeSet:
      id: 005-create-seat-table
      author: SapeginMihail
      changes:
        - createTable:
            tableName: seat
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_seat
                    nullable: false
              - column:
                  name: number
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: hall_id
                  type: bigint
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: seat
            baseColumnNames: hall_id
            referencedTableName: hall
            referencedColumnNames: id
            constraintName: fk_seat_hall