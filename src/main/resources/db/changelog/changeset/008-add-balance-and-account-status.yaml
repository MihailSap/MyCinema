databaseChangeLog:
  - changeSet:
      id: 008-add-balance-and-account-status
      author: SapeginMihail
      changes:
        - addColumn:
            tableName: person
            columns:
              - column:
                  name: balance
                  type: double precision
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: account_status
                  type: varchar(50)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
        - update:
            tableName: person
            columns:
              - column:
                  name: balance
                  valueNumeric: 0
            where: balance IS NULL
        - update:
            tableName: person
            columns:
              - column:
                  name: account_status
                  value: ACTIVE
            where: account_status IS NULL