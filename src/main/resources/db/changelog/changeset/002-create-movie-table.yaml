databaseChangeLog:
  - changeSet:
      id: 002-create-movie-table
      author: SapeginMihail
      changes:
        - createTable:
            tableName: movie
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_movie
                    nullable: false
              - column:
                  name: title
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: age_rating
                  type: varchar(10)
              - column:
                  name: minutes_length
                  type: integer
                  constraints:
                    nullable: false