databaseChangeLog:
  - changeSet:
      id: 007-create-booking-seat-table
      author: SapeginMihail
      changes:
        - createTable:
            tableName: booking_seat
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_booking_seat
                    nullable: false
              - column:
                  name: booking_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: seat_id
                  type: bigint
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: booking_seat
            baseColumnNames: booking_id
            referencedTableName: booking
            referencedColumnNames: id
            constraintName: fk_booking_seat_booking
        - addForeignKeyConstraint:
            baseTableName: booking_seat
            baseColumnNames: seat_id
            referencedTableName: seat
            referencedColumnNames: id
            constraintName: fk_booking_seat_seat