databaseChangeLog:
  - changeSet:
      id: 004-create-session-table
      author: SapeginMihail
      changes:
        - createTable:
            tableName: session
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_session
                    nullable: false
              - column:
                  name: ticket_price
                  type: numeric(4,2)
                  constraints:
                    nullable: false
              - column:
                  name: start_date_time
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: hall_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: movie_id
                  type: bigint
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: session
            baseColumnNames: hall_id
            referencedTableName: hall
            referencedColumnNames: id
            constraintName: fk_session_hall
        - addForeignKeyConstraint:
            baseTableName: session
            baseColumnNames: movie_id
            referencedTableName: movie
            referencedColumnNames: id
            constraintName: fk_session_movie